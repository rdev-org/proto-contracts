syntax = "proto3";

package user;

option go_package = "github.com/rdev-org/proto-contracts/pb/user";

import "common/meta.proto";
import "common/filter.proto";
import "common/pagination.proto";

import "user/address.proto";
import "user/preference.proto";

message Profile {
  common.Metadata  meta          = 1;
  string           user_id       = 2;
  string           first_name    = 3;
  string           middle_name   = 4;
  string           last_name     = 5;
  string           mobile_number = 6;
  string           date_of_birth = 7;
  string           gender        = 8;
  string           avatar        = 9;
  repeated Address address       = 10;
  Preference       preference    = 11;
}

message GetProfileRequest {
  string                uuid            = 1;
  common.RequestContext request_context = 2;
}

message GetProfileResponse {
  Profile profile = 1;
}

message ListProfileRequest {
  common.Filter            filter          = 1;
  common.PaginationRequest pagination      = 2;
  common.RequestContext    request_context = 3;
}

message ListProfileResponse {
  repeated Profile          profile    = 1;
  common.PaginationResponse pagination = 2;
}

message CreateProfileRequest {
  string                uuid            = 1;
  Profile               profile         = 2;
  common.RequestContext request_context = 3;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string                uuid            = 1;
  Profile               profile         = 2;
  common.RequestContext request_context = 3;
}

message UpdateProfileResponse {
  string  uuid    = 1;
  Profile profile = 2;
}

message DeleteProfileRequest {
  string                uuid            = 1;
  common.RequestContext request_context = 2;
}

message DeleteProfileResponse {
  string message = 1;
}