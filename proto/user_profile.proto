syntax = "proto3";

package user_profile;

option go_package = "github.com/rdev-org/proto-contracts/user_profile";

import "common/meta.proto";
import "common/filter.proto";
import "common/pagination.proto";

service UserProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc ListProfile(ListProfileRequest) returns (ListProfileResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
}

message Profile {
  common.Metadata       meta            = 1;
  common.RequestContext request_context = 2;
  string                user_id         = 3;
  string                first_name      = 4;
  string                middle_name     = 5;
  string                last_name       = 6;
  string                mobile_number   = 7;
  string                date_of_birth   = 8;
  string                gender          = 9;
  string                avatar          = 10;
}

message GetProfileRequest {
  string                uuid            = 1;
  common.RequestContext request_context = 2;
}

message GetProfileResponse {
  Profile profile = 1;
}

message ListProfileRequest {
  common.Filter            filter          = 1;
  common.PaginationRequest pagination      = 2;
  common.RequestContext    request_context = 3;
}

message ListProfileResponse {
  repeated Profile          profile    = 1;
  common.PaginationResponse pagination = 2;
}

message CreateProfileRequest {
  string                uuid            = 1;
  Profile               profile         = 2;
  common.RequestContext request_context = 3;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string                uuid            = 1;
  Profile               profile         = 2;
  common.RequestContext request_context = 3;
}

message UpdateProfileResponse {
  string  uuid    = 1;
  Profile profile = 2;
}

message DeleteProfileRequest {
  string                uuid            = 1;
  common.RequestContext request_context = 2;
}

message DeleteProfileResponse {
  string message = 1;
}