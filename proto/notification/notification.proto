syntax = "proto3";

package notification;

option go_package = "github.com/rdev-org/proto-contracts/pb/notification";

import "notification/email.proto";

service NotificationService {
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc RegisterEmail(RegisterEmailRequest) returns (RegisterEmailResponse);
  rpc ResetPasswordEmail(ResetPasswordEmailRequest) returns (ResetPasswordEmailResponse);
}