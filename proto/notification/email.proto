syntax = "proto3";

package notification;

option go_package = "github.com/rdev-org/proto-contracts/pb/notification";

import "common/meta.proto";
import "google/protobuf/timestamp.proto";

message Email {
  string recipient = 1;
  string subject   = 2;
  string body      = 3;
}

message SendEmailRequest {
  string                module          = 1;
  Email                 email           = 2;
  common.RequestContext request_context = 3;
}

message SendEmailResponse {
  string                    message         = 1;
  google.protobuf.Timestamp sent_at         = 2;
  common.RequestContext     request_context = 3;
}

message RegisterEmailRequest {
  Email                 email           = 1;
  common.RequestContext request_context = 2;
}

message RegisterEmailResponse {
  string                    message = 1;
  google.protobuf.Timestamp sent_at = 2;
}

message ResetPasswordEmailRequest {
  Email                 email           = 1;
  common.RequestContext request_context = 2;
}

message ResetPasswordEmailResponse {
  string                    message = 1;
  google.protobuf.Timestamp sent_at = 2;
}