syntax = "proto3";

package user_address;

option go_package = "github.com/rdev-org/proto-contracts/pb/user_address";

import "common/meta.proto";
import "common/filter.proto";
import "common/pagination.proto";

service UserAddressService {
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);
  rpc ListAddress(ListAddressRequest) returns (ListAddressResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc DefaultAddress(DefaultAddressRequest) returns (DefaultAddressResponse);
}

message Address {
  common.Metadata       meta            = 1;
  common.RequestContext request_context = 2;
  string                user_id         = 3;
  string                address_line1   = 4;
  string                address_line2   = 5;
  string                city            = 6;
  string                state_province  = 7;
  string                postal_code     = 8;
  string                country         = 9;
  bool                  is_default      = 10;
  string                address_type    = 11;
}

message GetAddressRequest {
  string                uuid            = 1;
  common.RequestContext request_context = 2;
}

message GetAddressResponse {
  Address address = 1;
}

message ListAddressRequest {
  string                   user_id         = 1;
  common.Filter            filter          = 2;
  common.PaginationRequest pagination      = 3;
  common.RequestContext    request_context = 4;
}

message ListAddressResponse {
  repeated Address          address    = 1;
  common.PaginationResponse pagination = 2;
}

message CreateAddressRequest {
  string                uuid            = 1;
  Address               address         = 2;
  common.RequestContext request_context = 3;
}

message CreateAddressResponse {
  string  uuid    = 1;
  Address address = 2;
}

message UpdateAddressRequest {
  string                uuid            = 1;
  Address               address         = 2;
  common.RequestContext request_context = 3;
}

message UpdateAddressResponse {
  string  uuid    = 1;
  Address address = 2;
}

message DeleteAddressRequest {
  string                uuid            = 1;
  common.RequestContext request_context = 2;
}

message DeleteAddressResponse {
  string message = 1;
}

message DefaultAddressRequest {
  string                uuid            = 1;
  string                user_id         = 2;
  common.RequestContext request_context = 3;
}

message DefaultAddressResponse {
  string  uuid    = 1;
  Address address = 2;
}
