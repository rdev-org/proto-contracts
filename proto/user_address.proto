syntax = "proto3";
package user_address;

option go_package = "github.com/rdev-org/proto-contracts/pb/user_address";

import "google/protobuf/timestamp.proto";

service UserAddressService {
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);
  rpc GetAllAddress(GetAllAddressRequest) returns (GetAllAddressResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc SetDefaultAddress(SetDefaultAddressRequest) returns (SetDefaultAddressResponse);
}

message Address {
  int64                     id             = 1;
  string                    user_id        = 2;
  string                    address_line1  = 3;
  string                    address_line2  = 4;
  string                    city           = 5;
  string                    state_province = 6;
  string                    postal_code    = 7;
  string                    country        = 8;
  bool                      is_default     = 9;
  string                    address_type   = 10;
  string                    status         = 11;
  string                    uuid           = 12;
  google.protobuf.Timestamp created_at     = 13;
  google.protobuf.Timestamp updated_at     = 14;
  google.protobuf.Timestamp deleted_at     = 15;
}

message AddressFilter {
  string city    = 1;
  string country = 2;
  string status  = 4;
  string search  = 5;
  string sort    = 6;
}

message PaginationRequest {
  int64 page_size = 1;
  int64 page      = 2;
}

message PaginationResponse {
  int64 total_count = 1;
}

message GetAddressRequest {
  string uuid = 1;
}

message GetAddressResponse {
  Address address = 1;
}

message GetAllAddressRequest {
  string            user_id    = 1;
  AddressFilter     filter     = 2;
  PaginationRequest pagination = 3;
}

message GetAllAddressResponse {
  repeated Address   address    = 1;
  PaginationResponse pagination = 2;
}

message CreateAddressRequest {
  Address address = 1;
}

message CreateAddressResponse {
  Address address = 1;
}

message UpdateAddressRequest {
  Address address = 1;
}

message UpdateAddressResponse {
  Address address = 1;
}

message DeleteAddressRequest {
  string uuid = 1;
}

message DeleteAddressResponse {
  string success = 1;
}

message SetDefaultAddressRequest {
  string uuid    = 1;
  string user_id = 2;
}

message SetDefaultAddressResponse {
  Address address = 1;
}
