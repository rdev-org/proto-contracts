syntax = "proto3";
package user;

option go_package = "github.com/rdev-org/proto-contracts/pb/user";

service UserService {
  rpc Login(UserLoginRequest) returns (UserLoginResponse);
  rpc Register(UserRegisterRequest) returns (UserRegisterResponse);
}

message UserLoginRequest {
  string username = 1;
  string password = 2;
}

message UserLoginResponse {
  string username = 1;
  string email    = 2;
  string token    = 3;
  int64  user_id  = 4;
}

message UserRegisterRequest {
  string username      = 1;
  string email         = 2;
  string mobile        = 3;
  string password_hash = 4;
  string first_name    = 5;
  string middle_name   = 6;
  string last_name     = 7;
  bool   is_verified   = 8;
  string status        = 9;
}

message UserRegisterResponse {
  string username = 1;
  string email    = 2;
}